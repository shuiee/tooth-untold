<meta charset="utf-8">
<title>The Statistical Tooth</title>
<meta name="description" content="What can a tooth remember? A composite first molar and canine built from European graves, 300–1900 CE, and the layers of evidence they carry.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#e9e8e4; --bg-2:#dfded9; --card:#f3f2ee;
  --ink:#1a1a18; --ink-2:#55544f; --ink-3:#8a8983; --rule:#c6c4bd;
  --bacteria:#b0362f; --virus:#2f55b0; --parasite:#16907a; --metal:#b98208;
  /* the radial timeline's secondary colour (a line whose per-year view is on): a deep tone of the renderer's dentine */
  --dentine-ink:#8a6d47;
  --serif:"Lora", Georgia, "Times New Roman", serif;
  /* labels, controls, numbers and tables. For now everything is Lora; to bring back a sans for these,
     load it in the <link> above and set it here, e.g. "Archivo", "Helvetica Neue", Arial, sans-serif */
  --label:var(--serif);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
/* labels, controls, numbers and tables use --label (see :root) */
.btn,.link,#lineup .lbl,.ctxnote,.tcap{font-family:var(--label)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
a{color:inherit}
.k{font-size:10.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.btn{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--ink);background:transparent;padding:6px 12px;cursor:pointer}
.btn:hover{background:var(--ink);color:var(--bg)}
.link{font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;background:none;border:0;padding:0;cursor:pointer;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}

/* stage */
#stage{position:relative;height:100%;min-height:640px;max-width:1600px;margin:0 auto;padding-inline:28px;padding-block:16px 26px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);overflow:hidden}
.fade{transition:opacity 1.1s ease}
#stage.intro .fade{opacity:0;pointer-events:none}

/* the journal frame, everything after the intro: a running head of small blocks, captions under plates and figures,
   page numbers in the bottom corners. Plates and figures are numbered; sections are 1 to 4, one per record */
.rh{grid-row:1;position:relative;z-index:5;display:flex;align-items:flex-start;gap:34px;padding-bottom:14px;font-family:var(--label);font-size:10.5px;line-height:1.4;color:var(--ink-3)}
.scene{grid-row:2}
.rh b{display:block;font-weight:600;color:var(--ink)}
.rh-b span,.rh-idx span{display:block}
.rh-idx{margin-left:auto;display:flex;gap:24px;align-items:flex-start}
.rh-idx button{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.rh-idx button b{font-weight:500;color:var(--ink-3)}
.rh-idx button:hover,.rh-idx button:hover b{color:var(--ink)}
.rh-idx button[aria-current="page"],.rh-idx button[aria-current="page"] b{color:var(--ink)}
.rh-idx button[aria-current="page"] span{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.rh-idx #rhBack{padding-left:24px;border-left:1px solid var(--rule)}
.rh-idx #rhBack[hidden]{display:none}
.folio{position:absolute;bottom:7px;z-index:5;font-family:var(--label);font-size:10px;color:var(--ink-3)}
.folio.l{left:28px}.folio.r{right:28px}


/* scene */
.scene{display:grid;grid-template-columns:minmax(0,1fr);gap:26px;min-height:0;padding-top:8px}
#stage.haspanel .scene{grid-template-columns:minmax(0,1.4fr) minmax(320px,1fr)}   /* the plate gets more room than the article */
.teeth{position:relative;min-height:0;display:flex;flex-direction:column}
#pair{position:relative;flex:1;min-height:360px;width:100%;max-width:1060px;margin:0 auto;display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 24px;transition:transform 1.3s cubic-bezier(.6,0,.2,1)}
.tooth{position:relative;min-width:0;cursor:grab;touch-action:none}
#tMolar{grid-column:2}#tCanine{grid-column:3}
.tooth canvas{position:absolute;inset:0;width:100%;height:100%;display:block;transition:opacity 1.2s ease}
#stage.intro .tooth canvas{opacity:0}
#ov,#cloud{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#ov{overflow:visible}
#ov .pt{pointer-events:auto;cursor:default}
#ov .pl{font-family:var(--label);font-size:11px;font-style:italic;fill:var(--ink-2);paint-order:stroke;stroke:rgba(233,232,228,.85);stroke-width:3px;stroke-linejoin:round}
#ov .pl-lead{fill:none;stroke:var(--ink);stroke-width:.6}
#ov .pl-dot{fill:var(--ink)}
#ov .tname{font-family:var(--label);font-size:10.5px;font-weight:600;letter-spacing:.08em;fill:var(--ink)}
.tcap{font-size:11.5px;line-height:1.45;color:var(--ink-2);margin:6px 0 0;display:flex;justify-content:space-between;align-items:baseline;gap:6px 18px;flex-wrap:wrap}
.tcap #when{color:var(--ink-3);margin-left:auto}
#stage.dashboard .tcap #when{display:none}

/* the radial timeline (radial.js), on the journal's own paper: ink hairlines, ink circles, names in Lora.
   A line whose per-year view is on turns --dentine-ink */
#radial{position:fixed;inset:0;z-index:3;background:var(--bg)}
#radial[hidden]{display:none}
.rd{display:block;width:100%;height:100%;font-family:var(--label)}
.rd-teeth,.rd-inside,.rd-stems,.rd-read,.rd-hub{pointer-events:none}
.rd-stem{fill:rgba(26,26,24,.55);stroke:none}
.rd-stem-soft{stroke:rgba(26,26,24,.5);stroke-width:1.6;fill:none}
.rd-inside{opacity:.6}
.rd-hub{fill:var(--bg);stroke:var(--ink)}
.rd-span{fill:var(--ink);stroke:none;pointer-events:none}
.rd-dot{fill:var(--bg);stroke:var(--ink);pointer-events:none;transition:fill .15s ease}
.rd-dot.nocount{stroke-dasharray:2.2 1.8}
.rd-dot.on{fill:var(--ink)}
.rd-hit{fill:transparent;cursor:pointer;outline:none}
.rd-hitline{stroke:transparent;stroke-width:16;fill:none;pointer-events:stroke}
.rd-name{fill:var(--ink);font-family:var(--label);font-weight:500;cursor:pointer;outline:none;paint-order:stroke;stroke:var(--bg);stroke-width:6px;stroke-linejoin:round}
.rd-name.go:hover{text-decoration:underline;text-underline-offset:4px}
.rd [data-cat],.rd-name{transition:opacity .25s ease}
.rd.rd-dim [data-cat]:not(.lit),.rd.rd-dim .rd-name:not(.lit){opacity:.16}
.rd-read{opacity:0;transition:opacity .15s ease}
.rd-read.on{opacity:1}
.rd-read line{stroke:var(--ink-3);stroke-width:.8}
.rd-yr,.rd-ct{font-family:var(--label);paint-order:stroke;stroke:var(--bg);stroke-width:6px;stroke-linejoin:round}
.rd-yr{fill:var(--ink);font-size:15px;font-weight:600}
.rd-ct{fill:var(--ink-2);font-size:13px;font-style:italic}
.rd-ring{fill:none;stroke:var(--ink);stroke-width:1.2;opacity:0;pointer-events:none}
.rd-ring.on{opacity:1}
#stage.radial .tooth canvas,#stage.radial #ov{opacity:0;transition-duration:.3s}
#stage.radial .tcap{visibility:hidden}
#again{position:absolute;right:28px;bottom:26px;z-index:6;display:none}
#stage.radial #again{display:inline-block}

/* intro */
#lineup{position:absolute;inset:0;pointer-events:none}
#lineup canvas{position:absolute;top:0;transition:transform 1.2s cubic-bezier(.6,0,.2,1),opacity .9s ease}
#lineup .box{position:absolute;border:1px solid var(--ink);opacity:0;transition:opacity .8s}
#lineup .lbl{position:absolute;white-space:nowrap;font-size:11px;font-weight:600;letter-spacing:.08em;text-align:center;transform:translateX(-50%);transition:transform 1.2s cubic-bezier(.6,0,.2,1),opacity .8s;opacity:0}
#lineup .arrows{position:absolute;left:0;right:0;text-align:center;font-size:22px;letter-spacing:.9em;color:var(--ink-2);opacity:0;transition:opacity .8s}
#jawLayer{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:4;transition:transform 1.4s cubic-bezier(.6,0,.2,1),opacity 1s}
#jaw{position:relative;height:min(78vh,640px);aspect-ratio:522/1010;perspective:2400px;perspective-origin:50% 42%}
#jaw .rig{position:absolute;inset:0;transform-style:preserve-3d}
#jaw canvas,#jaw svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#jaw .jw-up{height:50%;opacity:0}
#jaw .jw-lo{position:absolute;left:0;top:50%;width:100%;height:50%;transform-style:preserve-3d;transform-origin:50% 0}
#jaw .jw-lo canvas{backface-visibility:hidden;-webkit-backface-visibility:hidden}
#jaw .jw-lo .back{transform:rotateX(180deg)}
#jaw .rings{overflow:visible;transform:translateZ(.6px);opacity:0}
#jaw .rings.on{opacity:1}
#jaw .rings circle{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1s ease}
#jaw .rings .halo{stroke:var(--card);stroke-width:6}
#jaw .rings .pm{opacity:0;transition:opacity 1s ease .4s}
#jaw .rings .pm .halo{stroke-width:4.5}
#jaw .rings .dot{stroke-width:1.8;stroke-dasharray:.03 .022;stroke-dashoffset:0}
#jaw .rings.on circle{stroke-dashoffset:0}
#jaw .rings.on .pm{opacity:1}
#introText{position:absolute;left:28px;bottom:44px;max-width:480px;z-index:5;transition:opacity .9s}
#introText h1{font-weight:400;font-size:clamp(34px,4vw,52px);line-height:1.06;letter-spacing:-.01em;margin:0 0 12px}
#introText p{margin:0;color:var(--ink-2);font-size:14px;max-width:42ch}
#skip{position:absolute;right:28px;top:16px;z-index:6}
#stage:not(.intro) #skip,#stage:not(.intro) #introText{opacity:0;pointer-events:none}

/* a section as a spread: the plate on the left page, the article on the right, a soft gutter between */
.panel{position:relative;min-height:0;display:flex;flex-direction:column;justify-content:center}
.panel[hidden]{display:none}
#stage.dashboard .scene{gap:0}
#stage.dashboard .teeth{padding-right:30px}
#stage.dashboard #pair{grid-template-columns:96px minmax(0,1fr) minmax(0,1fr) 96px}
#stage.dashboard .panel{justify-content:flex-start;overflow-y:auto;padding:0 8px 0 30px;border-left:1px solid var(--rule);box-shadow:inset 16px 0 20px -18px rgba(26,26,24,.22)}
.dp{display:flex;flex-direction:column;animation:dpIn .7s ease both}
@keyframes dpIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec{display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-items:baseline;padding:2px 0 16px;border-bottom:1px solid var(--rule)}
.sec .no{grid-row:span 2;font-size:44px;line-height:.9;color:var(--ink)}
.sec h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.sec .dek{margin:3px 0 0;font-style:italic;font-size:13px;color:var(--ink-2)}
.fig{margin:0;padding:18px 0 16px;border-bottom:1px solid var(--rule)}
.notes{margin:8px 0 0;padding:0 0 0 17px;font-size:10.5px;line-height:1.45;color:var(--ink-3);max-width:84ch}
.notes li{margin:2px 0;padding-left:3px}
.dp svg.chart{width:100%;display:block;overflow:visible}
.dp svg text{font-family:var(--label);font-size:10px}
.dp svg text.ax{font-size:9.5px;fill:var(--ink-3)}
.dp svg text.rl{font-size:11px;fill:var(--ink)}
.dp svg text.cv{font-size:10px;font-weight:600}
.dp svg text.cn{font-size:7.5px}
.dp svg text.big{font-size:17px;fill:var(--ink)}
/* Fig. 2.2, the pathogen strand (drawPathogenStrand in app.js) */
.dp svg .rung{stroke:var(--ink);stroke-opacity:.1;stroke-width:.6}
.dp svg .ctxband{fill:var(--ink);fill-opacity:.045}
.dp svg .grid50{stroke:var(--ink-3);stroke-width:.6;stroke-dasharray:1 3}
.dp svg text.ctx,.dp svg text.gapl{font-size:9.5px;font-style:italic;fill:var(--ink-3)}
.dp svg text.ctx{paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
.dp svg text.cyr{font-size:10px;fill:var(--ink-2)}
.dp svg text.ld{font-size:10.5px;fill:var(--ink)}
.dp svg text.ld.thin{fill:var(--ink-3)}
.dp svg text.ld .pc{fill:var(--ink-3);font-size:9.5px}
.keylist.strand-key{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 14px;margin:2px 0 12px;font-family:var(--label);font-size:11.5px;line-height:1.55}
.strand-key .kind{font-size:9px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);padding-top:2px;white-space:nowrap}
.strand-key .kind i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.strand-key button{font:inherit;color:var(--ink);background:none;border:0;padding:0 3px;margin:0 7px 0 -3px;cursor:pointer;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px;transition:background .15s ease,color .15s ease}
.strand-key button small{font-size:9.5px;color:var(--ink-3);margin-left:4px}
.strand-key button:hover{text-decoration-color:var(--c)}
.strand-key button[aria-pressed="true"]{background:var(--c);color:var(--bg);text-decoration:none}
.strand-key button[aria-pressed="true"] small{color:inherit;opacity:.8}
.keylist.strand-read{display:block;margin:0 0 10px;min-height:3em;font-size:12px;line-height:1.5;color:var(--ink-2);max-width:74ch}
.strand-read b{color:var(--ink);font-weight:600}
.strand-read .link{margin-left:4px;font-size:10px}
.dp svg rect,.dp svg circle{cursor:default}
.keylist{display:flex;flex-wrap:wrap;gap:3px 14px;margin-top:8px;font-family:var(--label);font-size:10.5px;color:var(--ink-3)}
.keylist b{font-weight:500;color:var(--ink)}
.events{position:relative;height:200px}
.ev{position:absolute;bottom:10px;transform:translateX(-50%);width:min(40%,210px);margin:0}
.ev::after{content:"";position:absolute;left:50%;bottom:-10px;height:10px;border-left:1px solid var(--ink)}
.ev figcaption{font-family:var(--label);font-size:10.5px;line-height:1.3;color:var(--ink-3);margin-bottom:6px}
.ev figcaption b{display:block;font-weight:600;color:var(--ink)}
.ev img,.ev .slot{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.ev .slot{display:grid;place-items:center;border:1px solid var(--rule);background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(26,26,24,.06) 6px 7px);font-family:var(--label);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.axis{display:flex;justify-content:space-between;border-top:1px solid var(--ink);padding-top:4px;font-family:var(--label);font-size:10px;color:var(--ink-3)}
.ctxnote{font-size:10.5px;color:var(--ink-3);letter-spacing:.03em;margin:0}
/* the caries plate (caries.js): era rail, readout of three figures and one bar beside the molar; detail only on request */
.cp{display:flex;flex-direction:column;gap:14px}
.cp-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:-6px}
.cp-hint{font-size:12.5px;font-style:italic;color:var(--ink-3)}
.cp-rail{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.cp-rail button{display:flex;align-items:baseline;gap:7px;text-align:left;font-size:12.5px;color:var(--ink-2);background:transparent;border:1px solid var(--rule);padding:6px 9px;cursor:pointer}
.cp-rail button:hover{border-color:var(--ink-2);color:var(--ink)}
.cp-rail .n,.cp-rail .y{font-family:var(--label);font-size:10px;color:var(--ink-3);flex:none}
.cp-rail .y{margin-left:auto}
.cp-rail button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--card)}
.cp-rail button[aria-pressed="true"] .n{color:var(--ink);font-weight:600}
.cp-read{border-top:1px solid var(--rule);padding-top:12px}
.cp-era{font-size:26px;line-height:1.1;margin:0}
.cp-yrs{font-family:var(--label);font-size:11px;letter-spacing:.08em;color:var(--ink-3);margin:4px 0 0}
.cp-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:16px;margin-top:16px}
.cp-stats b{display:block;font-size:clamp(26px,3vw,36px);font-weight:500;line-height:1}
.cp-stats small{font-size:.55em}
.cp-stats span{display:block;font-size:12px;line-height:1.3;color:var(--ink-2);margin-top:6px}
.cp-bh,.cp-h4{font-family:var(--label);font-size:10.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:18px 0 8px}
.cp-bar{display:flex;height:24px;border:1px solid var(--ink);min-width:0}
.cp-bar span{height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--label);font-size:10px;font-weight:600;overflow:hidden;border-right:1px solid var(--ink);transition:width .7s cubic-bezier(.35,0,.2,1)}
.cp-bar span:last-child{border-right:0}
.cp-keys{display:flex;flex-wrap:wrap;gap:3px 14px;margin-top:8px;font-family:var(--label);font-size:10.5px;color:var(--ink-3)}
.cp-keys span{display:flex;align-items:center;gap:5px}
.cp-keys i{width:12px;height:10px;border:1px solid var(--ink)}
.cp-detail{border-top:1px solid var(--ink);padding-top:12px}
.cp-detail[hidden]{display:none}
.cp-dtop{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
.cp-dh{font-size:20px;margin:0}
.cp-dh em{display:block;font-family:var(--label);font-style:normal;font-size:10.5px;color:var(--ink-3);margin-top:4px}
.cp-e{display:grid;grid-template-columns:78px minmax(0,1fr);gap:12px;padding:9px 0;border-top:1px solid var(--rule)}
.cp-e:first-child{border-top:0;padding-top:0}
.cp-e .y{font-family:var(--label);font-size:10.5px;color:var(--ink-3);padding-top:2px}
.cp-e .t{font-size:13.5px;line-height:1.3;margin:0 0 2px}
.cp-e .m{font-size:12px;line-height:1.45;color:var(--ink-2);margin:0}
.cp-e .tag{display:inline-block;font-family:var(--label);font-size:8.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:0 4px;border:1px solid var(--ink-2);color:var(--ink-2);margin-left:7px;vertical-align:2px}
.cp-why{font-size:12.5px;line-height:1.55;color:var(--ink-2);margin:0;max-width:66ch}
.cp-why b{color:var(--ink);font-weight:600}
.cp-cmp{display:grid;gap:4px}
.cp-row{display:grid;grid-template-columns:96px minmax(0,1fr) 42px;gap:8px;align-items:center;font-size:12px;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--ink-2)}
.cp-row .nm{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-row.on .nm{color:var(--ink);font-weight:600}
.cp-row .cb{display:flex;height:14px;border:1px solid var(--ink);min-width:0}
.cp-row .cb span{height:100%;border-right:1px solid var(--ink)}
.cp-row .cb span:last-child{border-right:0}
.cp-row .v{font-family:var(--label);font-size:10px;color:var(--ink-3)}
/* Section 3, Wear and LEH: the plate's four views, and two boxed panels on the right that scroll on their own while the
   page column keeps its width (wearleh.js draws the figures) */
.views{display:flex;justify-content:center;gap:clamp(10px,3vw,40px);margin:6px 0 2px}
.views[hidden]{display:none}
/* Section 3's replay: at the plate's left edge (in line with the running head), its top level with the tooth names */
.wl-replay{position:absolute;left:0;z-index:4}
.wl-replay[hidden]{display:none}
.views button{font-family:var(--label);font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:transparent;border:1px solid var(--ink);padding:7px 0;min-width:92px;cursor:pointer}
.views button:hover{background:var(--card)}
.views button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.views .zoom{display:flex;gap:4px}
.views .zoom button{min-width:34px;font-size:15px;line-height:1;padding:6px 0}
#stage.dashboard .panel.twin{overflow:hidden}
.dp.wl{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;padding-bottom:6px}
/* each panel minimizes to its title bar (contents keep their width, just clipped) and the other takes the column */
.wl-box{transition:flex-grow .45s cubic-bezier(.3,0,.2,1),flex-basis .45s cubic-bezier(.3,0,.2,1)}
.wl-box.min{flex:0 0 44px;overflow:hidden}
.wl-box.min .wl-st{display:none}
.wl-tog{flex:none;width:26px;height:22px;border:1px solid var(--ink);background:transparent;cursor:pointer;position:relative;align-self:center}
.wl-tog::before,.wl-tog::after{content:"";position:absolute;left:7px;right:7px;top:50%;border-top:1.5px solid var(--ink);transform:translateY(-.75px)}
.wl-tog::after{transform:translateY(-.75px) rotate(90deg);opacity:0;transition:opacity .2s}
.wl-tog[aria-expanded="false"]::after{opacity:1}
.wl-tog:hover{background:var(--bg)}
/* first act: the molar and its panel alone; the canine and the LEH panel come in after */
#pair .tooth canvas{transition:opacity .9s ease}
#pair.molar-only #tCanine canvas{opacity:0}
/* caries, pathogens and metals: the molar alone, centred */
#pair.solo #tCanine{display:none}
#pair.solo #tMolar{grid-column:2 / 4}
.dp.wl.wear-only #wlLehBox{display:none}
#wlLehBox{animation:dpIn .7s ease both}
.wl-box{position:relative;flex:1 1 0;min-height:0;overflow-y:auto;scrollbar-gutter:stable;border:1px solid var(--ink);background:var(--card);padding:12px 14px 14px}
.wl-box .fig{padding-top:8px}
.wl-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.wl-top .wl-st{margin-left:auto}
.wl-top h3{margin:0;font-family:var(--label);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.wl-st{font-family:var(--label);font-size:10.5px;font-style:italic;color:var(--ink-3)}
.wl-peaks,.wl-strands{display:block;width:100%;overflow:visible}
.wl-peaks text,.wl-strands text{font-family:var(--label)}
.wl-floor .dash{stroke:#8a8983;stroke-width:.6;stroke-dasharray:3 3}
.wl-floor .edge{fill:rgba(26,26,24,.025);stroke:var(--ink);stroke-width:1.1}
.wl-rl{font-size:11px;fill:var(--ink-2);transition:fill .4s}
.wl-rl.hi,.wl-rl.sel{fill:var(--ink);font-weight:600}
.wl-ax{font-size:9.5px;fill:var(--ink-3)}
.wl-age{font-size:10.5px;font-weight:600}
.wl-peak .mesh{fill:none;stroke-opacity:.85;stroke-width:.55;stroke-linejoin:round;transition:stroke-opacity .5s,stroke-width .5s}
.wl-peak .body{fill-opacity:.14;stroke:none;transition:fill-opacity .5s}
.wl-peaks.playing .wl-row.hi .body,.wl-peaks.live .wl-peak:hover .body,.wl-peak.sel .body{fill-opacity:.26}
.wl-row{transition:transform .6s cubic-bezier(.3,0,.2,1),opacity .5s,filter .5s}
.wl-peaks.playing .wl-peak-row{opacity:.3}
.wl-peaks.playing .wl-row.hi{opacity:1;transform:translateY(-9px);filter:saturate(1.6) brightness(1.12)}
.wl-peaks.playing .wl-row.hi .mesh{stroke-opacity:1;stroke-width:.85}
.wl-v{font-size:10.5px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:3.5px;stroke-linejoin:round}
.wl-labs .wl-row{opacity:0;transition:opacity .35s,transform .6s cubic-bezier(.3,0,.2,1)}
.wl-labs .wl-row.hov,.wl-labs .wl-row.sel,.wl-peaks.playing .wl-labs .wl-row.hi{opacity:1}
.wl-v.sel{font-size:11.5px}
.wl-peaks.live .wl-peak{cursor:pointer}
.wl-peaks.live .wl-peak:hover .mesh,.wl-peak.sel .mesh{stroke-opacity:1;stroke-width:1}
.wl-peak:focus{outline:none}
.wl-peak:focus-visible .mesh{stroke:var(--ink);stroke-width:1.6}
.wl-big{margin:4px 0 2px;font-size:13px;color:var(--ink-2)}
.wl-big b{font-size:24px;font-weight:500;color:var(--c);margin-right:4px}
.wl-detail{padding-top:6px}
.wl-detail:empty{display:none}
.wl-detail h4{margin:4px 0 10px;font-size:15px;font-weight:500}
.wl-detail h4 span{font-family:var(--label);font-size:10.5px;color:var(--ink-3);margin-left:6px}
.wl-rowc{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:2px}
.wl-rowc .c{display:flex;flex-direction:column;align-items:center;padding:6px 0 5px;background:#e6e4de;font-family:var(--label)}
.wl-rowc .c b{font-size:13px}
.wl-rowc .c span{font-size:9.5px}
.wl-rowc .c i{font-style:normal;font-size:8.5px;opacity:.75}
.wl-rowc .c.sel{outline:2px solid var(--ink);outline-offset:-2px}
.wl-said{margin:10px 0 4px;padding-left:16px;font-size:12px;line-height:1.5;color:var(--ink-2)}
.wl-eh{margin:12px 0 6px;font-size:12.5px}
.wl-eh b{font-weight:600}
.wl-ed{margin:0 0 6px;font-size:12px;color:var(--ink-2)}
.wl-era{border-top:1px solid var(--rule);padding-top:4px;margin-top:10px}
.wl-ev{list-style:none;margin:0;padding:0}
.wl-ev li{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px dotted var(--rule)}
.wl-ev li:first-child{border-top:0}
.wl-ev .y{font-family:var(--label);font-size:10px;color:var(--ink-3);padding-top:2px}
.wl-ev .t{margin:0 0 2px;font-size:12.5px}
.wl-ev .m{margin:0;font-size:11px;line-height:1.45;color:var(--ink-2)}
.wl-ev .m b{font-weight:600;color:var(--ink-3);font-family:var(--label);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;margin-right:4px}
.wl-ev .tag{display:inline-block;font-family:var(--label);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--ink-3);color:var(--ink-3);padding:0 4px;margin-left:6px;vertical-align:1px}
.wl-none,.wl-src{font-size:10.5px;color:var(--ink-3);margin:6px 0 0;line-height:1.45}
/* the stress-line figures (lehfigs.js): C10 bars drawn like grooves, C9 ribbons and cemetery slopes, C8 composition */
.lf-c10,.lf-c9a-svg,.lf-c9b-svg,.lf-c8 svg{display:block;width:100%;overflow:visible}
.lf-c10 text,.lf-c9 text,.lf-c8 text{font-family:var(--label)}
.lf-ax{font-size:9.5px;fill:var(--ink-3)}
.lf-rl{font-size:11px;fill:var(--ink)}
.lf-v{font-size:13px;font-weight:600;fill:var(--ink)}
.lf-c10 .grid,.lf-c9 .grid,.lf-c8 .grid{stroke:#dcdad3;stroke-width:.6}
.lf-c9 .zero{stroke:#55544f;stroke-width:1}
.lf-bar{stroke-width:.6}
.lf-ribs{fill:none;stroke-width:.5;stroke-opacity:.35}
.lf-whisk path{fill:none;stroke:#13305e;stroke-width:1.3}
.lf-row{transition:opacity .4s}
.lf-c10.live .lf-row{cursor:pointer}
.lf-c10.live .lf-row:hover .lf-rl{font-weight:600}
.lf-c10.picked .lf-row:not(.sel){opacity:.45}
.lf-row.sel .lf-rl{font-weight:600}
.lf-row:focus{outline:none}
.lf-row:focus-visible .lf-bar{stroke:var(--ink);stroke-width:1.6}
.lh-btns{display:flex;gap:10px;flex-wrap:wrap;margin:2px 0 10px}
.wl-detail.lh{padding-top:12px}
.wl-detail.lh[hidden]{display:none}
.lh-k{font-family:var(--label);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.lh-btns{border-top:1px solid var(--rule);padding-top:12px;margin-top:14px}
.lh-btns .btn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lf-c9{display:flex;flex-direction:column;gap:16px}
.lf-c9.side{flex-direction:row;align-items:flex-start;gap:24px}
.lf-c9.side .lf-c9a{flex:0 0 58%}.lf-c9.side .lf-c9b{flex:1;min-width:0}
.lf-band{cursor:pointer;transition:opacity .4s}
.lf-band .fill{fill:var(--c);fill-opacity:.1}
.lf-band .ribs{fill:none;stroke:var(--c);stroke-opacity:.28;stroke-width:.5}
.lf-band .edge{fill:none;stroke:var(--c);stroke-opacity:.55;stroke-width:.7}
.lf-band .fit{fill:none;stroke:var(--c);stroke-width:2.6;stroke-linecap:round}
.lf-band circle{fill:var(--c);fill-opacity:.7}
.lf-band .hit{fill:none;stroke:transparent;stroke-width:14}
.lf-c9a-svg.picked .lf-band:not(.sel) .fill{fill-opacity:.04}
.lf-c9a-svg.picked .lf-band:not(.sel) .ribs,.lf-c9a-svg.picked .lf-band:not(.sel) .edge{stroke-opacity:.12}
.lf-c9a-svg.picked .lf-band:not(.sel) .fit{stroke-opacity:.35}
.lf-c9a-svg .lf-band.sel .fill{fill-opacity:.18}
.lf-c9a-svg .lf-band.sel .fit{stroke-width:3.4}
.lf-bl{font-size:10.5px;font-weight:600;cursor:pointer;transition:opacity .3s}
.lf-bl.dim{opacity:.4}
.lf-h{font-size:12px;font-weight:600;fill:var(--ink)}
.lf-c9b-svg .neg{fill:#1a1a18;fill-opacity:.04}
.lf-c9b-svg .zero{stroke:#55544f;stroke-width:1}
.lf-sn{font-size:10.5px;fill:var(--ink)}
.lf-site.pooled .lf-sn{font-weight:600}
.lf-sv{font-size:10.5px;font-weight:600}
.lf-c8{display:flex;flex-direction:column;gap:14px}
.lf-cv{font-size:10px;font-weight:600}
.lf-c8row,.lf-c8col{transition:opacity .4s,filter .4s}
.lf-c8row.dim,.lf-c8col.dim{opacity:.25;filter:grayscale(1)}
.lf-c8 .pool{stroke:var(--ink);stroke-width:2.4}
.lf-pv{font-size:10.5px;font-weight:600;fill:var(--ink)}
.lf-dot{cursor:pointer}
.lf-dot circle{transition:transform .2s;transform-box:fill-box;transform-origin:center}
.lf-c8col.wig .lf-dot circle{animation:lfWiggle .45s ease-in-out infinite}
.lf-c8col .hov{fill:transparent;pointer-events:all}
.lf-c8col{cursor:pointer}
.lh-btns .btn:disabled{opacity:.4;cursor:default}
.lh-btns .btn:disabled:hover{background:transparent;color:inherit}
@keyframes lfWiggle{0%,100%{transform:translate(0,0)}25%{transform:translate(-1.6px,.8px) rotate(-6deg)}75%{transform:translate(1.6px,-.8px) rotate(6deg)}}
.lf-fly{position:absolute;z-index:5;pointer-events:none}
@media (prefers-reduced-motion:reduce){.lf-c8col.wig .lf-dot circle{animation:none}}
/* the caries plate's decay on the 3D molar (app.js, drawCariesOverlay()) */
#ov .cp3-ring .lt{fill:none;stroke:#fbf8f1;stroke-width:2.4;stroke-opacity:.45}
#ov .cp3-ring .dk{fill:none;stroke:#3b3a35;stroke-width:1;stroke-dasharray:4 2}
#ov .cp3-ring.on .dk{stroke:#1a1a18;stroke-width:1.8;stroke-dasharray:none;opacity:1}
#ov .cp3-ring .hit{fill:none;stroke:transparent;stroke-width:12;pointer-events:stroke;cursor:pointer}
#ov .cp3-ring:hover .dk{stroke-width:1.8}
#ov .cp3-lab{pointer-events:auto;cursor:pointer}
#ov .cp3-lab text{font-family:var(--label);font-size:11px;font-style:italic;fill:var(--ink-2);paint-order:stroke;stroke:var(--bg);stroke-width:3.5px;stroke-linejoin:round}
#ov .cp3-lab .n{font-style:normal;font-weight:600;fill:var(--ink)}
#ov .cp3-lab .lead{fill:none;stroke:var(--ink-2);stroke-width:.6}
#ov .cp3-lab .lead-hit{fill:none;stroke:transparent;stroke-width:10}
#ov .cp3-lab circle{fill:var(--ink)}
#ov .cp3-lab:hover text,#ov .cp3-lab.on text{fill:var(--ink)}
#ov .cp3-lab.on text{font-weight:600}
#ov .cp3-lab.on .lead{stroke:var(--ink);stroke-width:1}
#ov .cp3-lab:focus{outline:none}
#ov .cp3-lab:focus-visible text{text-decoration:underline}
#tip{position:fixed;pointer-events:none;z-index:50;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.4;padding:7px 10px;max-width:300px}
#tip .m{font-size:11px;color:#bdbcb6}
.fallback{position:absolute;inset:0;display:grid;place-items:center;padding:30px;text-align:center;color:var(--ink-2)}

@media (max-width:1100px){
  #stage.dashboard .panel.twin{overflow:visible}
  .wl-box{flex:none;height:620px}
  .wl-box.min{height:44px}
  #stage{height:auto;min-height:0;overflow:visible}
  #stage.haspanel .scene,.scene{grid-template-columns:minmax(0,1fr);gap:18px}
  #pair{flex:none;height:min(80vw,600px);min-height:340px}
  .panel{max-width:680px}
  #introText{bottom:auto;top:62%}
  #jawLayer{place-items:start center;padding-top:58px}
  #jaw{height:min(50vh,440px)}
  #stage.dashboard .teeth{padding-right:0}
  #stage.radial .folio,#stage.radial #again{position:fixed}
  .rh-b:first-child span{display:none}
  .rh{gap:24px}
  #stage.radial .rh{position:fixed;left:28px;right:28px;top:16px}
  #stage.dashboard .panel{padding:12px 0 0;border-left:0;box-shadow:none;border-top:1px solid var(--rule)}
}
@media (max-width:700px){
  /* phones (not the priority; the web layout is): the view buttons wrap, Replay sits under the plate clear of the tooth
     names, and the wear landscape's labels shrink to its smaller cells */
  .views{gap:6px;flex-wrap:wrap}
  .views button{min-width:0;padding:6px 9px;font-size:10.5px}
  .views .zoom button{min-width:30px}
  .wl-replay:not([hidden]){position:static;display:block;margin:8px auto 0}
  .dp svg text.wl-rl{font-size:9.5px}
  .dp svg .wl-floor text.wl-rl:is(:nth-of-type(2),:nth-of-type(4),:nth-of-type(5)){display:none}   /* three periods named at rest */
  .dp svg .wl-floor:has(.wl-rl.hi,.wl-rl.sel) text.wl-rl{display:none}   /* while one plays or is picked, only its name */
  .dp svg .wl-floor text.wl-rl:is(.hi,.sel){display:block}
  .dp svg text.wl-v{font-size:8px}
  .dp svg text.wl-v.sel{font-size:8.5px}
  #stage{padding-inline:16px}
  #pair{height:min(118vw,540px);grid-template-columns:0 minmax(0,1fr) minmax(0,1fr) 0}
  #introText{left:16px;right:16px}
  .rh{flex-wrap:wrap;gap:8px 18px}
  .rh-idx{margin-left:0;width:100%;gap:14px;flex-wrap:wrap}
  .rh-idx #rhBack{padding-left:14px}
  .folio.l{left:16px}.folio.r{right:16px}
  #stage.dashboard #pair{grid-template-columns:0 minmax(0,1fr) minmax(0,1fr) 0}
  #again{right:16px;bottom:22px}
  #stage.radial .rh{left:16px;right:16px}
  .keylist.strand-key{grid-template-columns:minmax(0,1fr);gap:0}
  .strand-key .kind{padding-top:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="stage" class="intro">
  <header class="rh fade" id="rh">
    <div class="rh-b"><b>The Tooth Untold</b><span>What can a tooth remember?</span></div>
    <div class="rh-b" id="rhPlate"></div>
    <nav class="rh-idx" id="rhIdx" aria-label="Sections">
      <button data-l="caries"><b>1</b><span>Caries</span></button>
      <button data-l="pathogens"><b>2</b><span>Pathogens</span></button>
      <button data-l="wear"><b>3</b><span>Wear and LEH</span></button>
      <button data-l="metals"><b>4</b><span>Metals</span></button>
      <button data-l="interventions"><b>5</b><span>Artificial interventions</span></button>
      <button id="rhBack" hidden><b>Plate II</b><span>The timeline</span></button>
    </nav>
  </header>

  <main class="scene">
    <section class="teeth" aria-label="Composite teeth">
      <div id="pair">
        <div class="tooth" id="tMolar"><canvas></canvas></div>
        <div class="tooth" id="tCanine"><canvas></canvas></div>
        <canvas id="cloud"></canvas>
        <div id="lineup"></div>
        <svg id="ov"></svg>
      </div>
      <button class="btn wl-replay" id="wlReplay" type="button" hidden>Replay</button>
      <div class="views" id="views" hidden role="group" aria-label="View"><button data-v="top">Top</button><button data-v="side">Side</button><button data-v="section">Section</button><button data-v="perspective">Perspective</button><span class="zoom"><button data-z="-1" aria-label="Zoom out">−</button><button data-z="1" aria-label="Zoom in">+</button></span></div>
      <p class="tcap fade"><span id="when"></span></p>
    </section>
    <aside class="panel" id="panel" aria-live="polite" hidden></aside>
  </main>

  <div id="jawLayer" aria-hidden="true"><div id="jaw"><div class="rig"><canvas class="jw-up"></canvas><div class="jw-lo"><canvas class="front"></canvas><canvas class="back"></canvas><svg class="rings"></svg></div></div></div></div>
  <div id="introText"><h1>What can a tooth remember?</h1><p>Teeth outlast almost everything else in a grave. This story follows two composite teeth, built from thousands of real ones, through sixteen centuries of European history.</p></div>
  <button class="btn" id="skip">Skip intro</button>
  <button class="btn" id="again">Replay</button>
  <div id="radial" hidden></div>
  <span class="folio l fade" id="folioL"></span><span class="folio r fade" id="folioR"></span>
</div>
<div id="tip" hidden></div>
