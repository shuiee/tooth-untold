# Publishes the live page, https://shuiee.github.io/tooth-untold-prototype/, on every push to main.
# The site is served from the public repo shuiee/tooth-untold-prototype (this repo is private), so this rebuilds the
# standalone page from the source here (share.py, standard library only) and copies it there as index.html.
# Access: the deploy key "tooth-untold auto-deploy" on tooth-untold-prototype (write access to that repo only), whose
# private half is this repo's secret PAGES_DEPLOY_KEY. Revoke it in tooth-untold-prototype > Settings > Deploy keys.
name: Publish the live page
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: publish-site
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the standalone page
        run: python3 share.py
      - name: Copy it to the public site
        env:
          DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 git@github.com:shuiee/tooth-untold-prototype.git site
          cp share/statistical-tooth.html site/index.html
          cd site
          if git diff --quiet; then echo "The live page already matches main."; exit 0; fi
          git config user.name "tooth-untold publisher"
          git config user.email "actions@users.noreply.github.com"
          git commit -am "Publish tooth-untold ${GITHUB_SHA::7}"
          git push
